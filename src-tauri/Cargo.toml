[package]
name = "nini-albums"
version = "0.1.0"
description = "Local JPEG and Sony ARW photo tagging application"
authors = ["Nini Albums contributors"]
edition = "2021"

[lib]
name = "nini_albums_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

